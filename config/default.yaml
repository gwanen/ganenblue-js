bot:
  battle_mode: full_auto  # full_auto | semi_auto
  bot_mode: quest         # quest | raid | replicard | daily
  max_quests: 0           # 0 = unlimited
  max_raids: 0            # 0 = unlimited (for raid mode)
  quest_url: ""
  cache_clear_interval: 30  # Clear browser cache every N completed runs (0 = never)

daily:
  # Daily "quest skip" targets. Each entry opens its supporter screen and clicks
  # the OK (se-quest-start) button, which fires /rest/quest/questskip/skip.
  # HTTP 200 + raid_id = one skip consumed; HTTP 500 = quest exhausted for today.
  repeat_until_fail: true      # keep skipping the same quest until it fails, then move on
  max_attempts_per_quest: 20   # safety cap when repeat_until_fail is enabled
  loop_list: false             # re-run the whole list after finishing one pass
  skip_timeout: 10000          # ms to wait for the questskip response after clicking OK
  reward_timeout: 5000         # ms to wait for the skip_raid result rewards
  quests:
    - id: hard
      name: Hard
      url: 'https://game.granbluefantasy.jp/#quest/supporter/305261/28'
      enabled: true
    - id: omega_pro
      name: Omega Pro
      url: 'https://game.granbluefantasy.jp/#quest/supporter/305441/28/0/18'
      enabled: true
    - id: primal_legends
      name: Primal Legends
      url: 'https://game.granbluefantasy.jp/#quest/supporter/305471/28/0/47'
      enabled: true
    - id: primarch_test_pro
      name: Primarch Test Pro
      url: 'https://game.granbluefantasy.jp/#quest/supporter/305651/28/0/5311'
      enabled: true
    - id: omega_impossible_pro
      name: Omega Impossible Pro
      url: 'https://game.granbluefantasy.jp/#quest/supporter/305461/28/0/32'
      enabled: true
    - id: six_dragon_advent_pro
      name: Six Dragon Advent Pro
      url: 'https://game.granbluefantasy.jp/#quest/supporter/104111/28'
      enabled: true
    - id: showdown_pro
      name: Showdown Pro
      url: 'https://game.granbluefantasy.jp/#quest/supporter/103951/28'
      enabled: true
    - id: clash_pro
      name: Clash Pro
      url: 'https://game.granbluefantasy.jp/#quest/supporter/103991/28'
      enabled: true
    - id: angel_halo_pro
      name: Angel Halo Pro
      url: 'https://game.granbluefantasy.jp/#quest/supporter/305301/28'
      enabled: true
    - id: primal_trial_pro
      name: Primal Trial Pro
      url: 'https://game.granbluefantasy.jp/#quest/supporter/104081/28'
      enabled: true
    - id: eternal_trial_pro
      name: Eternal Trial Pro
      url: 'https://game.granbluefantasy.jp/#quest/supporter/104191/28'
      enabled: true

browser:
  browser_type: 'chromium' # chromium or edge
  headless: false
  width: 1920
  height: 1080
  timeout: 30000

combat:
  # Abilities that attack without consuming a turn (e.g. charge/dash attacks).
  # When one of these fires in ability_result.json, the bot refreshes the page
  # immediately like a normal attack (animation skip) instead of obeying the
  # skill-refresh setting. Match is case-insensitive on the ability name.
  attack_like_abilities:
    - "Unbound Charge"
    - "Koenig Dekret"
    - "Advanced Kinesis"
    - "Tag Team"

stealth:
  randomize_viewport: true
  randomize_user_agent: true
  block_resources: false  # Block images/css for speed
  
logging:
  level: info  # debug | info | warn | error
  file: logs/bot.log
  console: true

screenshots:
  on_error: true
  directory: screenshots/

timeouts:
  page_load: 30000
  element_wait: 10000
  battle_max: 1800000  # 30 minutes
  semi_auto_watchdog: 5000       # Timeout waiting for attack button to appear (ms)
  semi_auto_attack_confirm: 3000  # Timeout waiting for attack network confirmation (ms)
  loop_interval: 10       # Battle loop polling interval in ms

  # Full-auto inactivity watchdog thresholds (ms). The watchdog hard-reloads and
  # re-engages FA when no battle action is seen within the active threshold, which
  # is dynamic: set per event below and starting at initial_lockout.
  full_auto:
    ability_watchdog: 8000      # After an ability is used
    summon_watchdog: 8000       # After a summon is used
    turn_start_watchdog: 15000  # After a new turn begins
    initial_lockout: 25000      # After every FA click (OUGI animation lockout)
    recovery_reset: 15000       # After a watchdog recovery reload

  # Raid-specific timeouts
  raid:
    error_detection: 3000       # Time to detect raid join errors
    element_click: 1000         # Timeout for click operations
    join_race: 3000             # Time to wait for join confirmation (summon/ok/battle)
    page_transition: 200        # Delay for page transitions
    pending_detail_xhr: 2000    # Additional wait for detail XHR in pending battles
    pending_hard_timeout: 5000  # Hard timeout for pending battle processing
    cooldown: 5000              # Cooldown per step (used in 15s total cooldown)
