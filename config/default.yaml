bot:
  battle_mode: full_auto  # full_auto | semi_auto
  bot_mode: quest         # quest | raid | replicard
  max_quests: 0           # 0 = unlimited
  max_raids: 0            # 0 = unlimited (for raid mode)
  quest_url: ""
  cache_clear_interval: 30  # Clear browser cache every N completed runs (0 = never)

browser:
  browser_type: 'chromium' # chromium or edge
  headless: false
  width: 1920
  height: 1080
  timeout: 30000

combat:
  # Abilities that attack without consuming a turn (e.g. charge/dash attacks).
  # When one of these fires in ability_result.json, the bot refreshes the page
  # immediately like a normal attack (animation skip) instead of obeying the
  # skill-refresh setting. Match is case-insensitive on the ability name.
  attack_like_abilities:
    - "Unbound Charge"
    - "Koenig Dekret"
    - "Advanced Kinesis"
    - "Tag Team"

stealth:
  randomize_viewport: true
  randomize_user_agent: true
  block_resources: false  # Block images/css for speed
  
logging:
  level: info  # debug | info | warn | error
  file: logs/bot.log
  console: true

screenshots:
  on_error: true
  directory: screenshots/

timeouts:
  page_load: 30000
  element_wait: 10000
  battle_max: 1800000  # 30 minutes
  semi_auto_watchdog: 5000       # Timeout waiting for attack button to appear (ms)
  semi_auto_attack_confirm: 3000  # Timeout waiting for attack network confirmation (ms)
  loop_interval: 10       # Battle loop polling interval in ms

  # Full-auto inactivity watchdog thresholds (ms). The watchdog hard-reloads and
  # re-engages FA when no battle action is seen within the active threshold, which
  # is dynamic: set per event below and starting at initial_lockout.
  full_auto:
    ability_watchdog: 8000      # After an ability is used
    summon_watchdog: 8000       # After a summon is used
    turn_start_watchdog: 15000  # After a new turn begins
    initial_lockout: 25000      # After every FA click (OUGI animation lockout)
    recovery_reset: 15000       # After a watchdog recovery reload

  # Raid-specific timeouts
  raid:
    error_detection: 3000       # Time to detect raid join errors
    element_click: 1000         # Timeout for click operations
    join_race: 3000             # Time to wait for join confirmation (summon/ok/battle)
    page_transition: 200        # Delay for page transitions
    pending_detail_xhr: 2000    # Additional wait for detail XHR in pending battles
    pending_hard_timeout: 5000  # Hard timeout for pending battle processing
    cooldown: 5000              # Cooldown per step (used in 15s total cooldown)
